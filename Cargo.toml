[package]
name = "wsblast"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "High-performance WebSocket load testing CLI with percentile latency & CI gating"
repository = "https://github.com/jephter-olamiposi/wsblast"
homepage = "https://github.com/jephter-olamiposi/wsblast"
readme = "README.md"
keywords = ["websocket", "load-testing", "benchmark", "tui", "hdrhistogram"]
categories = ["command-line-utilities", "development-tools::profiling", "network-programming"]
exclude = [
    "assets/*",
    "Dockerfile",
    ".dockerignore",
    "install.sh",
    ".github/*",
]

# `cargo binstall wsblast` downloads the archives dist publishes to GitHub
# Releases: wsblast-<target>.tar.gz with the binary under wsblast-<target>/,
# and a flat wsblast-<target>.zip on Windows.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots", "native-tls"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std", "async-await"] }
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
hdrhistogram = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { version = "0.9", optional = true }
thiserror = "2.0"
indicatif = "0.17"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
comfy-table = "7.1"
colored = "3.0"
tokio-util = "0.7"
url = { version = "2.5", features = ["serde"] }
http = "1.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[features]
default = []
scenario = ["serde_yaml"]
auth = []
graphql-ws = []
compare = []
full = ["scenario", "auth", "graphql-ws", "compare"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1"

[[bench]]
name = "metrics_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
