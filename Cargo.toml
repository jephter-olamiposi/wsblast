[package]
name = "wsblast"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Rust-focused WebSocket load testing CLI"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std", "async-await"] }
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
hdrhistogram = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
indicatif = "0.17"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
comfy-table = "7.1"
colored = "3.0"
tokio-util = "0.7"
url = "2.5"
http = "1.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "metrics_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
