[package]
name = "wsblast"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "High-performance WebSocket load testing CLI with percentile latency & CI gating"
repository = "https://github.com/jephter-olamiposi/wsblast"
homepage = "https://github.com/jephter-olamiposi/wsblast"
readme = "README.md"
keywords = ["websocket", "load-testing", "benchmark", "tui", "hdrhistogram"]
categories = ["command-line-utilities", "development-tools::profiling", "network-programming"]
exclude = [
    "assets/*",
    "Dockerfile",
    ".dockerignore",
    "install.sh",
    ".github/*",
]

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots", "native-tls"] }
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
prost-types = { version = "0.13", optional = true }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std", "async-await"] }
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
hdrhistogram = "7.5"
serde = { version = "1.0", features = ["derive"] }
base64 = { version = "0.21" }
rand = { version = "0.8", features = ["small_rng"] }
sha2 = { version = "0.10" }
serde_json = "1.0"
serde_yaml = { version = "0.9", optional = true }
thiserror = "2.0"
indicatif = "0.17"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
comfy-table = "7.1"
colored = "3.0"
tokio-util = "0.7"
url = { version = "2.5", features = ["serde"] }
http = "1.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }

# Observability
opentelemetry = { version = "0.27", features = ["metrics"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["tonic", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
prometheus-client = { version = "0.25", optional = true }
tracing = { version = "0.1", optional = true }
flate2 = { version = "1.1", optional = true }
jsonwebtoken = { version = "9", optional = true }
oauth2 = { version = "5", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }
crossbeam = { version = "0.8", optional = true }
pcap-file = { version = "3.0.0-rc1", optional = true }
fastrand = { version = "2.1", optional = true }
uuid = { version = "1.8", features = ["v4", "serde"], optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }

[features]
default = []
scenario = ["serde_yaml"]
otel = ["opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk"]
prometheus = ["prometheus-client", "axum", "tower"]
compression = ["flate2"]
auth = ["jsonwebtoken", "oauth2", "chrono", "reqwest"]
graphql-ws = []
capture = ["crossbeam", "pcap-file"]
chaos = ["fastrand", "crossbeam"]
mock = ["tokio-tungstenite/native-tls"]
distributed = ["tonic", "prost", "prost-types", "uuid", "tracing", "tracing-subscriber"]
compare = []
full = ["scenario", "otel", "prometheus", "compression", "auth", "graphql-ws", "capture", "chaos", "compare", "mock", "distributed"]
tracing-subscriber = ["dep:tracing-subscriber"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1"

[build-dependencies]
tonic-build = { version = "0.12" }



[[bench]]
name = "metrics_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
