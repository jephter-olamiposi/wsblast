[package]
name = "wsblast"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "High-performance WebSocket load testing CLI with percentile latency & CI gating"
repository = "https://github.com/jephter-olamiposi/wsblast"
homepage = "https://github.com/jephter-olamiposi/wsblast"
readme = "README.md"
keywords = ["websocket", "load-testing", "benchmark", "latency", "performance"]
categories = [
    "command-line-utilities",
    "development-tools::testing",
    "development-tools::profiling",
    "network-programming",
    "web-programming::websocket",
]
# Publish an explicit file list so new repository files never leak into the
# crate. The bench target is listed in this manifest, so its source ships too.
include = [
    "/src/**",
    "/benches/**",
    "/examples/**",
    "/schema/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/METHODOLOGY.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# `cargo binstall wsblast` downloads the archives dist publishes to GitHub
# Releases: wsblast-<target>.tar.gz with the binary under wsblast-<target>/,
# and a flat wsblast-<target>.zip on Windows.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std", "async-await"] }
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.6"
clap_mangen = "0.3"
hdrhistogram = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = { version = "0.9.42", optional = true }
thiserror = "2.0"
indicatif = "0.17"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
comfy-table = "7.1"
colored = "3.0"
tokio-util = "0.7"
url = { version = "2.5", features = ["serde"] }
http = "1.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"], optional = true }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics"], optional = true }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"], optional = true }
# Already in the tree through tokio-tungstenite's rustls support; the agent
# and the mock server use it directly to accept TLS connections.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }

[features]
# Every feature except `otel` is on by default, so `cargo install wsblast` and
# the release binaries ship the whole CLI. `auth`, `graphql-ws`, `compare`,
# `prometheus`, `capture` and `mock` add no dependencies; `distributed` uses
# tokio-rustls, which tokio-tungstenite already pulls in; `scenario` adds the
# YAML parser. `otel` pulls in the OpenTelemetry SDK and an HTTP client, so it
# is opt-in. Library users can opt out with `default-features = false`.
default = ["scenario", "compare", "auth", "graphql-ws", "prometheus", "capture", "mock", "distributed"]
scenario = ["dep:serde_norway"]
auth = []
graphql-ws = []
compare = []
# `--prometheus-listen`: a /metrics endpoint served for the length of a run.
prometheus = ["tokio/io-util"]
# `--otel-endpoint`: periodic OTLP/HTTP export to an OpenTelemetry collector.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:reqwest"]
# `--capture`: JSONL recording of every data frame and connection event.
capture = []
# `wsblast mock`: a WebSocket test server with delays, stalls, rejections,
# closes and capture replay, over ws:// or wss://, also usable in-process as
# `wsblast::mock`. TLS uses tokio-rustls, already in the tree.
mock = ["dep:tokio-rustls"]
# `wsblast agent` and `--agents`, also usable in-process as
# `wsblast::distributed`: load generated by several machines, with results
# merged on a coordinator.
distributed = ["dep:tokio-rustls"]
# Kept so existing `--features full` invocations keep working.
full = ["scenario", "auth", "graphql-ws", "compare", "prometheus", "capture", "mock", "distributed"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.43", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
criterion = "0.5"
proptest = "1"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[bench]]
name = "metrics_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
