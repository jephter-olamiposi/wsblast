[package]
name = "wsblast"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "High-performance WebSocket load testing CLI with percentile latency & CI gating"
repository = "https://github.com/jephter-olamiposi/wsblast"
homepage = "https://github.com/jephter-olamiposi/wsblast"
readme = "README.md"
keywords = ["websocket", "load-testing", "benchmark", "latency", "performance"]
categories = [
    "command-line-utilities",
    "development-tools::testing",
    "development-tools::profiling",
    "network-programming",
    "web-programming::websocket",
]
# Publish an explicit file list so new repository files never leak into the
# crate. The bench target is listed in this manifest, so its source ships too.
include = [
    "/src/**",
    "/benches/**",
    "/examples/**",
    "/schema/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/METHODOLOGY.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# `cargo binstall wsblast` downloads the archives dist publishes to GitHub
# Releases: wsblast-<target>.tar.gz with the binary under wsblast-<target>/,
# and a flat wsblast-<target>.zip on Windows.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std", "async-await"] }
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.6"
clap_mangen = "0.3"
hdrhistogram = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = { version = "0.9.42", optional = true }
thiserror = "2.0"
indicatif = "0.17"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
comfy-table = "7.1"
colored = "3.0"
tokio-util = "0.7"
url = { version = "2.5", features = ["serde"] }
http = "1.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[features]
# Every feature is on by default, so `cargo install wsblast` and the release
# binaries ship the whole CLI. `auth`, `graphql-ws` and `compare` add no
# dependencies; `scenario` adds the YAML parser. Library users can opt out
# with `default-features = false`.
default = ["scenario", "compare", "auth", "graphql-ws"]
scenario = ["dep:serde_norway"]
auth = []
graphql-ws = []
compare = []
# Kept so existing `--features full` invocations keep working.
full = ["scenario", "auth", "graphql-ws", "compare"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.43", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
criterion = "0.5"
proptest = "1"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[bench]]
name = "metrics_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
