syntax = "proto3";

package wsblast;

// Generated with tonic_build

service Coordinator {
  rpc AssignWork(AssignWorkRequest) returns (AssignWorkResponse);
  rpc ReportMetrics(ReportMetricsRequest) returns (ReportMetricsResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  rpc MergeHistograms(MergeHistogramsRequest) returns (MergeHistogramsResponse);
}

service Worker {
  rpc GetWork(GetWorkRequest) returns (GetWorkResponse);
  rpc PushMetrics(PushMetricsRequest) returns (PushMetricsResponse);
}

message AssignWorkRequest {
  string worker_id = 1;
  uint32 start_connection = 2;
  uint32 end_connection = 3;
  repeated string target_urls = 4;
  LoadTestConfig config = 5;
}

message AssignWorkResponse {
  bool success = 1;
  string message = 2;
}

message ReportMetricsRequest {
  string worker_id = 1;
  repeated HistogramData metrics = 2;
  WorkerMetrics worker_metrics = 3;
}

message ReportMetricsResponse {
  bool success = 1;
  string message = 2;
}

message HeartbeatRequest {
  string worker_id = 1;
  WorkerStatus status = 2;
  uint32 connections_completed = 3;
  uint64 messages_sent = 4;
  uint64 messages_recv = 5;
  uint64 errors = 6;
}

message HeartbeatResponse {
  bool success = 1;
  bool should_shutdown = 2;
  string message = 3;
}

message ShutdownRequest {
  string reason = 1;
}

message ShutdownResponse {
  bool success = 1;
  string message = 2;
}

message MergeHistogramsRequest {
  repeated HistogramData histograms = 1;
}

message MergeHistogramsResponse {
  HistogramData merged_histogram = 1;
}

message GetWorkRequest {
  string worker_id = 1;
}

message GetWorkResponse {
  uint32 start_connection = 1;
  uint32 end_connection = 2;
  bool has_work = 3;
  LoadTestConfig config = 4;
  bool shutdown = 5;
}

message PushMetricsRequest {
  string worker_id = 1;
  repeated HistogramData metrics = 2;
}

message PushMetricsResponse {
  bool success = 1;
}

enum WorkerStatus {
  WORKER_STATUS_UNSPECIFIED = 0;
  WORKER_STATUS_IDLE = 1;
  WORKER_STATUS_RUNNING = 2;
  WORKER_STATUS_COMPLETED = 3;
  WORKER_STATUS_FAILED = 4;
}

message HistogramData {
  string name = 1;
  repeated uint64 buckets = 2;
  repeated uint64 counts = 3;
}

message LoadTestConfig {
  string target_url = 1;
  uint32 connections = 2;
  uint64 ramp_rate = 3;
  uint64 duration_ms = 4;
  uint64 max_requests = 5;
  uint64 rate_per_conn = 6;
  string payload = 7;
  map<string, string> headers = 8;
  string subprotocol = 9;
  TestMode mode = 10;
  uint64 connect_timeout_ms = 11;
  uint64 message_timeout_ms = 12;
  uint64 ping_interval_ms = 13;
  string graphql_operation = 14;
  string graphql_operation_name = 15;
  string graphql_variables = 16;
  string graphql_extensions = 17;
  bool chaos_enabled = 18;
  uint64 chaos_latency_ms = 19;
  double chaos_loss_percent = 20;
  double chaos_corrupt_percent = 21;
  double chaos_close_percent = 22;
  bool no_reconnect = 23;
}

enum TestMode {
  TEST_MODE_ECHO = 0;
  TEST_MODE_STREAM = 1;
  TEST_MODE_LISTEN = 2;
  TEST_MODE_GRAPHQL_WS = 3;
}

message WorkerMetrics {
  string worker_id = 1;
  repeated HistogramData handshake_histogram = 2;
  repeated HistogramData rtt_histogram = 3;
  uint64 messages_sent = 4;
  uint64 messages_recv = 5;
  uint64 bytes_sent = 6;
  uint64 bytes_recv = 7;
  map<int32, uint64> errors = 8;
  uint64 connections_established = 9;
  uint64 connections_failed = 10;
  uint64 reconnects = 11;
}

enum ErrorCategory {
  ERROR_CATEGORY_DNS_RESOLUTION = 0;
  ERROR_CATEGORY_TCP_CONNECT = 1;
  ERROR_CATEGORY_TLS_HANDSHAKE = 2;
  ERROR_CATEGORY_HTTP_UPGRADE_REJECTED = 3;
  ERROR_CATEGORY_PROTOCOL_ERROR = 4;
  ERROR_CATEGORY_WRITE_ERROR = 5;
  ERROR_CATEGORY_READ_ERROR = 6;
  ERROR_CATEGORY_TIMEOUT = 7;
  ERROR_CATEGORY_UNEXPECTED_CLOSE = 8;
  ERROR_CATEGORY_OTHER = 9;
}