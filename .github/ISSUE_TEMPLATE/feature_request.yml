name: Feature request
description: Suggest a new capability or an improvement to wsblast.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to test or measure, and what makes it hard with wsblast today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work, for example new flags, output fields or report formats.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other tools that handle this.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Load generation and pacing
        - Latency metrics and percentiles
        - SLO gating and CI integration
        - Reports (text, JSON, Markdown)
        - Live TUI dashboard
        - Protocols and authentication
        - Installation and packaging
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself.
