name: Bug report
description: Report incorrect behaviour, a crash or misleading results in wsblast.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not report
        security vulnerabilities here; follow SECURITY.md instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including the full output or error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        The exact wsblast command line, any scenario or config files, and the
        target server. If possible, reproduce it against
        `cargo run --example echo_server`.
      placeholder: |
        1. cargo run --example echo_server
        2. wsblast ws://127.0.0.1:9001 -c 50 -d 10s --max-p99 25ms
        3. ...
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: wsblast version
      description: Output of `wsblast --version`.
      placeholder: wsblast 0.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install wsblast?
      options:
        - cargo install
        - cargo binstall
        - install.sh or the shell installer
        - PowerShell installer
        - Release archive download
        - Docker
        - Built from source
    validations:
      required: true
  - type: input
    id: features
    attributes:
      label: Cargo features
      description: Features enabled when building, if any (for example `scenario` or `full`).
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: Ubuntu 24.04 x86_64, macOS 15 arm64, Windows 11 x86_64
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Server implementation, network setup, JSON report output, or anything else that helps.
