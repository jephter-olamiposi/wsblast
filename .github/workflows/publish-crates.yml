# Called by release.yml (generated by dist) after the GitHub Release is
# created. dist only runs publish jobs for stable versions, so prerelease tags
# never reach crates.io.
#
# Authentication uses crates.io trusted publishing: the job exchanges its
# GitHub OIDC token for a short-lived crates.io token, so no long-lived API
# token is stored in the repository. See RELEASING.md for the one-time setup.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
